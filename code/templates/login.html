<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - KYES Trivia AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: #F8F7F4;
            border: 1px solid #E6A473;
            border-radius: 1.25rem;
            box-shadow: 0 4px 30px rgba(230, 164, 115, 0.2);
        }
        .auth-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 0.75rem;
            background: #fff;
            color: #333;
            font-size: 1rem;
        }
        .auth-button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #cd8f68 0%, #b8845e 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .auth-button:hover {
            background: linear-gradient(135deg, #b8845e 0%, #a37854 100%);
        }
        .flash-messages {
            list-style: none;
            padding: 0;
            margin-bottom: 1rem;
        }
        .flash-messages li {
            padding: 0.75rem;
            border-radius: 0.75rem;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            text-align: center;
        }
        .switch-auth {
            text-align: center;
            margin-top: 1rem;
        }
        .switch-auth a {
            color: #f5a373;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>ログイン</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="auth-button">ログイン</button>
        </form>
        <div class="switch-auth">
            <p>アカウントをお持ちでないですか？ <a href="{{ url_for('register') }}">新規登録</a></p>
        </div>
    </div>
</body>
</html>
