<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYES Trivia AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="prompt-view" class="prompt-container">
        <div class="welcome-message">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="KYES Trivia AI Logo" class="logo-main">
            <h1>
                {% if session['username'] %}
                    {{ session['username'] | upper }}さん、
                {% endif %}
                いらっしゃいませ
            </h1>
        </div>
        <div class="main-prompt">
            <p>本日はどのようなお手伝いをさせていただけますか？</p>
            <form class="chat-form" method="post">
                <div class="input-wrapper">
                    <textarea 
                        name="question"
                        placeholder="メッセージを入力してください..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button type="submit" class="send-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m22 2-7 20-4-9-9-4Z"/>
                            <path d="M22 2 11 13"/>
                        </svg>
                    </button>
                </div>
            </form>
            <div class="category-container">
                <div class="category-buttons">
                    <!-- Category buttons will be inserted here by JS -->
                </div>
                <div class="suggested-questions-container">
                     <div class="suggested-questions"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-view" class="chat-container" style="display: none;">
        <header class="chat-header">
            <h1>KYES Trivia AI</h1>
             <div class="header-controls">
                <a href="{{ url_for('logout') }}" class="auth-button">ログアウト</a>
                <button class="clear-button">チャットをクリア</button>
            </div>
        </header>

        <div class="chat-messages">
            <!-- Chat messages will be dynamically inserted here -->
        </div>

        <div class="chat-input-container">
            <form class="chat-form-bottom" method="post">
                <div class="input-wrapper">
                    <textarea 
                        name="question-bottom"
                        placeholder="メッセージを入力してください..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button type="submit" class="send-button">
                         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m22 2-7 20-4-9-9-4Z"/>
                            <path d="M22 2 11 13"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="js-config"
         data-has-history="{{ has_history | tojson }}"
         data-chat-history='{{ chat_history | tojson }}'
         data-questions-by-category='{{ initial_questions_by_category | tojson }}'
         data-chat-url="{{ url_for('index') }}"
         data-clear-url="{{ url_for('clear_history') }}"
    ></div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
